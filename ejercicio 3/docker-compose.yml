name: cine-ejercicio-3

services:
  sin-lock:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    command: ["python", "sin_lock.py"]
  con-lock:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app:ro
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    command: ["python", "con_lock.py"]
